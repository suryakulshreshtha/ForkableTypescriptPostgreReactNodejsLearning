name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: without this every job inherits the repository default
# token, which is frequently contents: write.
permissions:
  contents: read

# Three pushes in a minute should not run three Postgres services and three
# Playwright installs to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, type-check, unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forkable_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # NOTE: actions are pinned by tag, not by commit SHA. A tag can be
      # repointed at any commit by whoever controls the action, which is how
      # the tj-actions/changed-files compromise reached thousands of repos.
      # Pin these properly with a tool that resolves real SHAs:
      #     go install github.com/suzuki-shunsuke/pinact/cmd/pinact@latest
      #     pinact run
      # Dependabot (see .github/dependabot.yml) then keeps the SHAs current.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Apply every migration in order. Previously only 001 ran, so CI tested a
      # schema that no environment actually has -- and 003's composite index,
      # which the session queries depend on, was never exercised.
      - name: Apply migrations to test database
        env:
          PGPASSWORD: postgres
        run: |
          for migration in backend/migrations/0*.sql; do
            case "$migration" in *seed*) continue;; esac   # seed data is dev-only
            echo "applying $migration"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres \
                 -d forkable_learning_test -f "$migration"
          done

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Type-check
        working-directory: backend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Integration tests
        working-directory: backend
        env:
          TEST_PGHOST: localhost
          TEST_PGPORT: 5432
          TEST_PGUSER: postgres
          TEST_PGPASSWORD: postgres
          TEST_PGDATABASE: forkable_learning_test
        run: npm run test:integration

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend (lint, type-check, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Unit / component tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forkable_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The e2e database gets the seed data too -- the README says it is seeded
      # and the suite ran against an empty database.
      - name: Apply migrations and seed the dev database
        env:
          PGPASSWORD: postgres
        run: |
          for migration in backend/migrations/0*.sql; do
            echo "applying $migration"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres \
                 -d forkable_learning -f "$migration"
          done

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        env:
          CI: true
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: forkable_learning
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
